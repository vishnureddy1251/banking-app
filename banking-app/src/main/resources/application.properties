# ===========================
# APPLICATION CONFIGURATION
# ===========================
spring.application.name=banking-app
server.port=8080

# ===========================
# H2 DATABASE CONFIGURATION
# ===========================
# H2 is an in-memory database - data resets when app restarts
# Perfect for learning! Later you can switch to MySQL/PostgreSQL
spring.datasource.url=jdbc:h2:mem:bankingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ===========================
# H2 CONSOLE (Browser UI to see your DB)
# ===========================
# Access at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console