# ===========================
# APPLICATION
# ===========================
spring.application.name=banking-app
server.port=8080

# ===========================
# SQLITE DATABASE
# ===========================
spring.datasource.url=jdbc:sqlite:bankingdb.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ===========================
# WRITE BATCHING / JPA / HIBERNATE (JPA/Hibernate)
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Batch 20 inserts into a single DB call instead of 20 separate calls
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# ===========================
# TIMEOUTS (Resilience4j)
# ===========================
# If external service doesn't respond in 3 seconds, timeout and fail
resilience4j.timelimiter.instances.paymentTimeout.timeoutDuration=3s
resilience4j.timelimiter.instances.paymentTimeout.cancelRunningFuture=true

resilience4j.timelimiter.instances.transferTimeout.timeoutDuration=5s
resilience4j.timelimiter.instances.transferTimeout.cancelRunningFuture=true

resilience4j.timelimiter.instances.loanTimeout.timeoutDuration=10s
resilience4j.timelimiter.instances.loanTimeout.cancelRunningFuture=true

# ===========================
# CIRCUIT BREAKER CONFIG
# ===========================

# --- Payment Circuit Breaker ---
# If 50% of last 5 calls fail ? circuit OPENS (blocks requests)
resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
# Wait 10 seconds before trying again (HALF-OPEN state)
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10000
# In HALF-OPEN, allow 3 test requests
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=3
# Automatically go from OPEN ? HALF-OPEN after wait time
resilience4j.circuitbreaker.instances.paymentService.automaticTransitionFromOpenToHalfOpenEnabled=true

# --- Loan Circuit Breaker ---
resilience4j.circuitbreaker.instances.loanService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.loanService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.loanService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.loanService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.loanService.automaticTransitionFromOpenToHalfOpenEnabled=true

# --- Transfer Circuit Breaker ---
resilience4j.circuitbreaker.instances.transferService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.transferService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.transferService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.transferService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.transferService.automaticTransitionFromOpenToHalfOpenEnabled=true

# ===========================
# ACTUATOR (Monitor circuit breaker)
# ===========================
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ===========================
# SWAGGER / OPENAPI
# ===========================
# Swagger UI settings
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true

# ===========================
# RATE LIMITING
# ===========================
# Max requests per minute per IP
app.rate-limit.requests-per-minute=20

# ===========================
# GRAPHQL
# ===========================
# Enable GraphiQL UI (interactive browser tool)
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# GraphQL endpoint
spring.graphql.path=/graphql

# ===========================
# REDIS CACHE
# ===========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

# Redis cache TTL (time to live) - 5 minutes
app.redis.cache-ttl-minutes=5

# Show errors in response (for development)
spring.graphql.schema.printer.enabled=true